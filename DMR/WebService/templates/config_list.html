{% extends "base.html" %}

{% block content %}
<div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2>配置文件管理</h2>
        <div>
            <button id="btn-apply-all" class="btn-secondary" style="display:none;" onclick="applyAll()">全部应用</button>
            <button id="btn-defer-all" class="btn-secondary" style="display:none;" onclick="deferAll()">全部推迟到重启</button>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>文件名</th>
                <th>启用状态</th>
                <th>变更状态</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="config-tbody">
            <tr><td colspan="4" style="color:#999;">加载中...</td></tr>
        </tbody>
    </table>
</div>

<div id="diff-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:1000;align-items:center;justify-content:center;" onclick="if(event.target===this)closeDiff()">
    <div style="background:#1b1b1b;border:1px solid #444;border-radius:8px;width:820px;max-width:94vw;max-height:86vh;display:flex;flex-direction:column;">
        <div style="padding:10px 14px;border-bottom:1px solid #333;color:#ddd;">查看改动 - <span id="diff-title" style="color:#6f9"></span> <span style="color:#777;font-size:0.8rem;">（已应用 → 当前；<span style="color:#4caf50;">绿=新增</span> <span style="color:#e05555;">红=删除</span>）</span></div>
        <pre id="diff-body" style="margin:0;padding:10px 14px;overflow:auto;font-family:Consolas,monospace;font-size:0.82rem;line-height:1.45;flex:1;background:#141414;"></pre>
        <div style="padding:8px 14px;border-top:1px solid #333;display:flex;justify-content:space-between;">
            <button onclick="revertFromDiff()" style="color:#fff;background:#c0392b;border-color:#c0392b;">撤销全部改动</button>
            <button onclick="closeDiff()">关闭</button>
        </div>
    </div>
</div>

<script>
    var diffFile = null;
    function openDiff(filename) {
        diffFile = filename;
        var box = document.getElementById('diff-body');
        document.getElementById('diff-title').textContent = filename;
        box.textContent = '加载中...';
        document.getElementById('diff-overlay').style.display = 'flex';
        fetch('/api/config/diff/' + encodeURIComponent(filename))
            .then(function (r) { return r.json(); })
            .then(function (d) {
                var lines = d.diff || [];
                if (!lines.length) { box.textContent = '无改动（或已应用）。'; return; }
                box.innerHTML = lines.map(function (l) {
                    var c = '#ccc', bg = 'transparent';
                    if (l.indexOf('@@') === 0)              { c = '#4ea1ff'; }
                    else if (l.indexOf('+++') === 0 || l.indexOf('---') === 0) { c = '#888'; }
                    else if (l[0] === '+')                  { c = '#4caf50'; bg = 'rgba(76,175,80,0.12)'; }
                    else if (l[0] === '-')                  { c = '#e05555'; bg = 'rgba(224,85,85,0.12)'; }
                    return '<div style="color:' + c + ';background:' + bg + ';white-space:pre-wrap;word-break:break-all;">' + esc(l || ' ') + '</div>';
                }).join('');
            })
            .catch(function () { box.textContent = '加载失败'; });
    }
    function closeDiff() { document.getElementById('diff-overlay').style.display = 'none'; }
    function revertFromDiff() {
        if (!diffFile) return;
        var fn = diffFile;
        closeDiff();
        revertConfig(fn);   // 自带确认 + 刷新
    }
</script>

<script>
    var STATUS_META = {
        'new':      { text: '待应用（新增）',      color: '#1a8917' },
        'modified': { text: '待应用（修改）',      color: '#e08e00' },
        'deleted':  { text: '待应用（删除）',      color: '#c00'    },
        'deferred': { text: '待应用（重启时生效）', color: '#7a8aa0' }
    };

    function esc(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // 把完整路径渲染成「文件夹\文件」：文件夹点击开目录、文件点击用默认应用打开
    function pathCell(full, fallback) {
        if (!full) return esc(fallback || '');
        var norm = full.replace(/\//g, '\\');
        var idx = norm.lastIndexOf('\\');
        var fileName = idx >= 0 ? norm.slice(idx + 1) : norm;
        var folderFull = idx >= 0 ? full.slice(0, idx) : full;
        var parentPart = idx >= 0 ? norm.slice(0, idx) : '';
        var pidx = parentPart.lastIndexOf('\\');
        var folderName = pidx >= 0 ? parentPart.slice(pidx + 1) : parentPart;
        var folderLink = '<a href="javascript:void(0)" title="打开文件夹" onclick=\'openPath(' + JSON.stringify(folderFull) + ',"folder")\' style="color:#4ea1ff;text-decoration:none;">' + esc(folderName || folderFull) + '</a>';
        var fileLink = '<a href="javascript:void(0)" title="用默认应用打开" onclick=\'openPath(' + JSON.stringify(full) + ',"file")\' style="color:#7fd1ff;text-decoration:none;">' + esc(fileName) + '</a>';
        return folderLink + '\\' + fileLink;
    }

    function buildRow(c) {
        var fnAttr = esc(c.filename);

        var nameCell = c.exists
            ? pathCell(c.path, c.filename)
            : '<span style="text-decoration:line-through;color:#c00;">' + esc(c.filename) + '</span>';

        // global 全局配置：蓝色标签、必须启用、不能开关；改了只能整程序重启生效，操作只给查看/撤销
        if (c.is_global) {
            var gOps = [];
            if (c.status === 'modified') {
                gOps.push('<a href="javascript:void(0);" class="op-diff" data-fn="' + fnAttr + '" style="color:#6f42c1;">查看</a>');
                gOps.push('<a href="javascript:void(0);" class="op-revert" data-fn="' + fnAttr + '" style="color:#c0392b;">撤销</a>');
            }
            var gChange = c.status === 'modified'
                ? '<span style="color:#e08e00;font-weight:bold;">● 已修改（重启后生效）</span>'
                : '<span style="color:#999;">已同步</span>';
            return '<tr style="background:rgba(78,161,255,0.07);">' +
                '<td>' + nameCell + '</td>' +
                '<td><span style="color:#4ea1ff;font-weight:bold;">◆ 全局配置（必须启用）</span></td>' +
                '<td>' + gChange + '</td>' +
                '<td>' + (gOps.join('&nbsp;&nbsp;') || '') + '</td>' +
                '</tr>';
        }

        // 启用状态：文字标签（绿●已启用 / 灰○未启用），磁盘已删的显示 —
        var enableCell = !c.exists ? '—'
            : (c.enabled
                ? '<span style="color:#1a8917;font-weight:bold;">● 已启用</span>'
                : '<span style="color:#888;">○ 未启用</span>');

        // 变更状态：只表达「磁盘 vs 已加载」的差异；停用/已删的不适用，显示 —
        var meta = STATUS_META[c.status];
        var changeCell = meta
            ? '<span style="color:' + meta.color + ';font-weight:bold;">● ' + meta.text + '</span>'
            : (c.exists && c.enabled ? '<span style="color:#999;">已同步</span>' : '—');

        // 操作：启用/停用 + 查看/应用/撤销推迟
        var ops = [];
        if (c.exists) {
            ops.push(c.enabled
                ? '<button class="op-toggle" data-fn="' + fnAttr + '" data-en="0" style="color:#000;border-color:#dc3545;">停用</button>'
                : '<button class="op-toggle" data-fn="' + fnAttr + '" data-en="1" style="color:#000;border-color:#4caf50;">启用</button>');
        }
        var isPending = (c.status === 'new' || c.status === 'modified' || c.status === 'deleted');
        if (isPending || c.status === 'deferred') {
            ops.push('<a href="javascript:void(0);" class="op-diff" data-fn="' + fnAttr + '" style="color:#6f42c1;">查看</a>');
        }
        if (isPending) {
            ops.push('<a href="javascript:void(0);" class="op-apply" data-fn="' + fnAttr + '" style="color:#0066cc;font-weight:bold;">应用</a>');
        }
        if (c.status === 'deferred') {
            ops.push('<a href="javascript:void(0);" class="op-undefer" data-fn="' + fnAttr + '" style="color:#0066cc;">撤销推迟</a>');
        }

        return '<tr>' +
            '<td>' + nameCell + '</td>' +
            '<td>' + enableCell + '</td>' +
            '<td>' + changeCell + '</td>' +
            '<td>' + (ops.join('&nbsp;&nbsp;') || '') + '</td>' +
            '</tr>';
    }

    function refreshConfigList() {
        return fetch('/api/config/list')
            .then(function (r) { return r.json(); })
            .then(function (data) {
                var tbody = document.getElementById('config-tbody');
                var configs = data.configs || [];
                if (configs.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="color:#999;">暂无配置文件。</td></tr>';
                } else {
                    tbody.innerHTML = configs.map(buildRow).join('');
                }
                // 批量「全部应用/全部推迟」只针对任务，global 不参与（它只能重启生效）
                var hasPending = configs.some(function (c) {
                    return !c.is_global && (c.status === 'new' || c.status === 'modified' || c.status === 'deleted');
                });
                document.getElementById('btn-apply-all').style.display = hasPending ? '' : 'none';
                document.getElementById('btn-defer-all').style.display = hasPending ? '' : 'none';
                if (window.updateNavBadges) updateNavBadges(data.notifications);
            })
            .catch(function (e) { console.error('刷新配置列表失败:', e); });
    }

    function toggleConfig(filename, enabled) {
        var verb = enabled ? '启用' : '停用';
        if (!confirm('确定' + verb + ' ' + filename + ' 吗？\n' + (enabled ? '将立即启动该任务。' : '正在录制的话会被停止。'))) return;
        fetch('/api/config/toggle/' + encodeURIComponent(filename), {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ enabled: enabled })
        })
            .then(function (r) { return r.json(); })
            .then(function (d) { if (!d.ok) alert(d.message || (verb + '失败')); refreshConfigList(); })
            .catch(function (e) { alert('请求失败: ' + e); });
    }

    function applyConfig(filename) {
        if (!confirm('确定应用 ' + filename + ' 的改动吗？\n对应任务若空闲会立即重启生效，正在录制则等空闲后再生效。')) return;
        fetch('/api/config/apply/' + encodeURIComponent(filename), { method: 'POST' })
            .then(function (r) { return r.json(); })
            .then(function (d) { alert(d.message || (d.ok ? '已应用' : '应用失败')); refreshConfigList(); })
            .catch(function (e) { alert('请求失败: ' + e); });
    }

    function revertConfig(filename) {
        if (!confirm('确定撤销 ' + filename + ' 的未应用改动吗？\n将回到上次已应用的版本（新增的文件会被删除）。此操作直接改磁盘文件。')) return;
        fetch('/api/config/revert/' + encodeURIComponent(filename), { method: 'POST' })
            .then(function (r) { return r.json(); })
            .then(function (d) { if (!d.ok) alert(d.message || '撤销失败'); refreshConfigList(); })
            .catch(function (e) { alert('请求失败: ' + e); });
    }

    function undeferConfig(filename) {
        fetch('/api/config/undefer/' + encodeURIComponent(filename), { method: 'POST' })
            .then(function (r) { return r.json(); })
            .then(function () { refreshConfigList(); });
    }

    function applyAll() {
        if (!confirm('确定应用所有待应用的改动吗？')) return;
        var btns = document.querySelectorAll('.op-apply');
        var names = Array.prototype.map.call(btns, function (b) { return b.dataset.fn; });
        Promise.all(names.map(function (fn) {
            return fetch('/api/config/apply/' + encodeURIComponent(fn), { method: 'POST' });
        })).then(function () { refreshConfigList(); });
    }

    function deferAll() {
        fetch('/api/config/defer_all', { method: 'POST' })
            .then(function (r) { return r.json(); })
            .then(function (d) { alert(d.message || '已推迟'); refreshConfigList(); });
    }

    // 事件委托：动态行里的按钮
    document.getElementById('config-tbody').addEventListener('click', function (e) {
        var t = e.target;
        if (!t.dataset || !t.dataset.fn) return;
        if (t.classList.contains('op-toggle'))       toggleConfig(t.dataset.fn, t.dataset.en === '1');
        else if (t.classList.contains('op-diff'))    openDiff(t.dataset.fn);
        else if (t.classList.contains('op-apply'))   applyConfig(t.dataset.fn);
        else if (t.classList.contains('op-revert'))  revertConfig(t.dataset.fn);
        else if (t.classList.contains('op-undefer')) undeferConfig(t.dataset.fn);
    });

    startPolling(refreshConfigList, 1500);
</script>
{% endblock %}
