{% extends "base.html" %}

{% block content %}
<style>
    .table-scroll {
        overflow-x: hidden;
    }
    .table-scroll table {
        white-space: normal;
        table-layout: auto;
    }
    .table-scroll th,
    .table-scroll td,
    .table-scroll a {
        overflow-wrap: anywhere;
        word-break: break-word;
    }
</style>
<!-- 四个阶段队列：每个文件按「当前阶段」只出现一次（互斥）。
     进行中(带%/倒计时) + 已完成子集；内容全部由 JS 轮询 /api/tasks 构建，空则不显示。 -->
<div class="card">
    <h2>人工处理队列</h2>
    <div id="held-tasks" class="table-scroll"></div>
</div>

<div class="card">
    <h2>渲染队列</h2>
    <div id="render-queue" class="table-scroll"></div>
</div>

<div class="card">
    <h2>合并队列</h2>
    <div id="merge-queue" class="table-scroll"></div>
</div>

<div class="card">
    <h2>上传队列</h2>
    <div id="upload-queue" class="table-scroll"></div>
</div>

<div class="card">
    <h2>清理队列</h2>
    <div id="clean-queue" class="table-scroll"></div>
</div>

<script>
    function stopUploadTask(uuid) {
        if (!confirm('确定要停止此上传任务吗？停止后会进入「人工处理队列」，可重试或忽略。')) return;
        fetch(`/api/upload_tasks/${uuid}/stop`, { method: 'POST' })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') { refreshTasks(); }
                else { alert('停止失败: ' + data.message); }
            })
            .catch(error => console.error('Error:', error));
    }

    function escHtml(s) {
        return String(s == null ? '' : s)
            .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    // 把完整路径渲染成 “文件夹\文件名”，文件夹点击打开目录、文件名点击用默认播放器打开。
    function pathCell(full) {
        if (!full) return '-';
        var norm = full.replace(/\//g, '\\');
        var idx = norm.lastIndexOf('\\');
        var fileName = idx >= 0 ? norm.slice(idx + 1) : norm;
        var folderFull = idx >= 0 ? full.slice(0, idx) : full;
        var parentPart = idx >= 0 ? norm.slice(0, idx) : '';
        var pidx = parentPart.lastIndexOf('\\');
        var folderName = pidx >= 0 ? parentPart.slice(pidx + 1) : parentPart;
        var folderLink = '<a href="javascript:void(0)" title="打开文件夹" onclick=\'openPath(' + JSON.stringify(folderFull) + ',"folder")\' style="color:#4ea1ff;text-decoration:none;">' + escHtml(folderName || folderFull) + '</a>';
        var fileLink = '<a href="javascript:void(0)" title="用默认播放器打开" onclick=\'openPath(' + JSON.stringify(full) + ',"file")\' style="color:#7fd1ff;text-decoration:none;">' + escHtml(fileName) + '</a>';
        return folderLink + '\\' + fileLink;
    }

    // —— 队列渲染小工具 ——
    // 已完成子集统一表格：任务 + 文件
    function rowsTaskFile(rows) {
        if (!rows || !rows.length) return '';
        let h = '<table><thead><tr><th>任务</th><th>文件</th></tr></thead><tbody>';
        rows.forEach(r => { h += `<tr><td>${escHtml(r.task)}</td><td>${pathCell(r.path)}</td></tr>`; });
        return h + '</tbody></table>';
    }
    // 子分组小标题：内容为空就不显示
    function subBlock(title, inner) {
        return inner ? `<div style="color:#9ab;font-size:0.82em;margin:8px 0 2px;">${title}</div>` + inner : '';
    }

    function renderQueueHtml(q) {
        q = q || {}; let act = '';
        const a = q.active || [];
        if (a.length) {
            act = '<table><thead><tr><th>任务</th><th>视频</th><th>输出</th><th>模式</th><th>状态</th></tr></thead><tbody>';
            a.forEach(t => {
                let s = t.status === 'waiting' ? '<span style="color:#666">等待中...</span>'
                      : (t.progress ? `渲染中 ${t.progress}` : '渲染中...');
                act += `<tr><td>${escHtml(t.task)}</td><td>${pathCell(t.video_path)}</td><td>${pathCell(t.output_path)}</td><td>${escHtml(t.mode)}</td><td>${s}</td></tr>`;
            });
            act += '</tbody></table>';
        }
        return subBlock('渲染中', act) + subBlock('已渲染（待合并/上传）', rowsTaskFile(q.done));
    }

    function mergeQueueHtml(q) {
        q = q || {};
        const act = (q.active && q.active.length) ? rowsTaskFile(q.active) : '';
        return subBlock('合并中', act) + subBlock('已合并（待上传/清理）', rowsTaskFile(q.done));
    }

    function uploadQueueHtml(q) {
        q = q || {}; let act = '';
        const a = q.active || [];
        if (a.length) {
            act = '<table><thead><tr><th>任务</th><th>文件</th><th>上传至</th><th>进度/信息</th><th>操作</th></tr></thead><tbody>';
            a.forEach(t => {
                const files = (t.files || []).map(f => `<div>${pathCell(f.path)}</div>`).join('');
                let info = t.status === 'waiting' ? '<span style="color:#666">等待中...</span>'
                    : (t.progress ? `上传中 ${t.progress}` : '上传中...');
                act += `<tr><td>${escHtml(t.task)}</td><td>${files}</td><td>${escHtml(t.account)} (${escHtml(t.engine)})</td><td>${info}</td>` +
                       `<td><button onclick="stopUploadTask('${t.uuid}')" style="background-color:#dc3545;">停止</button></td></tr>`;
            });
            act += '</tbody></table>';
        }
        return subBlock('上传中', act) + subBlock('已上传（待清理或完成）', rowsTaskFile(q.done));
    }

    function cleanQueueHtml(rows) {
        if (!rows || !rows.length) return '';
        let h = '<table><thead><tr><th>文件</th><th>操作</th><th>剩余时间</th></tr></thead><tbody>';
        rows.forEach(t => {
            const files = (t.files || []).map(f => `<div>${pathCell(f)}</div>`).join('');
            h += `<tr><td>${files}</td><td>${escHtml(t.method)}</td>` +
                 `<td class="remaining-time" data-execute-at="${t.execute_at}" style="color:#888;font-size:0.85em;"></td></tr>`;
        });
        return h + '</tbody></table>';
    }

    // —— 人工处理（挂起）相关 ——
    function mp4Form(task, hid, ph) {
        var inputId = 'mp4_' + hid;
        return '<input id="' + inputId + '" type="text" placeholder="' + escHtml(ph) + '" style="width:55%;">' +
               ' <button onclick=\'resumeHold(' + JSON.stringify(task) + ',' + JSON.stringify(hid) +
               ',document.getElementById("' + inputId + '").value)\'>提交</button>';
    }
    function resumeHold(task, hid, result) {
        if (!result) { alert('请先填入结果（渲染/合并好的 mp4 路径）'); return; }
        fetch('/api/resume', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({task: task, hold_id: hid, result: result}),
        }).then(function(r) {
            if (r.ok) { refreshTasks(); }
            else { r.text().then(function(t) { alert('提交失败: ' + t); }); }
        });
    }
    function ignoreHold(task, hid) {
        if (!confirm('忽略后这段将从管线里摘除、不再参与后续合并/上传/清理（硬盘文件不动）。确定？')) return;
        resumeHold(task, hid, '__ignore__');
    }
    function retryHold(task, hid) {
        if (!confirm('重新跑一遍原来的操作（渲染/合并/上传）？')) return;
        fetch('/api/retry', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({task: task, hold_id: hid}),
        }).then(function(r) { if (r.ok) { refreshTasks(); } else { alert('重试失败'); } });
    }
    function heldHtml(held) {
        if (!held || !held.length) return '';
        let html = '';
        held.forEach(h => {
            const info = h.info || {}, hid = h.hold_id, tk = h.task, stage = h.stage;
            let body = '', form = '';
            if (stage === 'render') {
                const dmFile = info.danmaku || info.ass;   // info.ass 仅兼容旧的挂起任务
                const isDm = !!dmFile;
                body = '<div>源 flv：' + pathCell(info.flv) + '</div>' +
                       (isDm ? '<div>弹幕文件：' + pathCell(dmFile) + '</div>' : '') +
                       '<div style="color:#c00">错误：' + escHtml(info.error || '') + '</div>';
                form = mp4Form(tk, hid, (isDm ? '渲染' : '转码') + '好后填入 mp4 路径');
            } else if (stage === 'merge') {
                const ins = (info.inputs || []).map(p => '<div>' + pathCell(p) + '</div>').join('');
                body = '<div>合并类型：' + escHtml(info.merge_type || '') + '</div>' +
                       '<div>待合并文件：</div>' + ins +
                       '<div style="color:#c00">错误：' + escHtml(info.error || '') + '</div>';
                form = mp4Form(tk, hid, '合并好后填入 mp4 路径');
            } else if (stage === 'upload') {
                const files = (info.files || []).map(p => '<div>' + pathCell(p) + '</div>').join('');
                body = '<div>待上传：</div>' + files +
                       '<div>账号：' + escHtml(info.account || '') + '</div>' +
                       '<div>标题：' + escHtml(info.title || '') + '</div>' +
                       '<div>简介：' + escHtml(info.desc || '') + '</div>' +
                       '<div>动态：' + escHtml(info.dynamic || '') + '</div>' +
                       '<div>封面：' + (info.cover ? pathCell(info.cover) : '-') + '</div>' +
                       '<div style="color:#c00">错误：' + escHtml(info.error || '') + '</div>';
                form = '<button onclick=\'resumeHold(' + JSON.stringify(tk) + ',' + JSON.stringify(hid) + ',"done")\'>上传完成，继续清理</button>';
            }
            const retryBtn = ' <button onclick=\'retryHold(' + JSON.stringify(tk) + ',' + JSON.stringify(hid) + ')\' style="background-color:#4caf50;color:#000;">重试</button>';
            const ignoreBtn = ' <button onclick=\'ignoreHold(' + JSON.stringify(tk) + ',' + JSON.stringify(hid) + ')\' style="background-color:#777;">忽略</button>';
            html += '<div style="border:1px solid #555;border-radius:6px;padding:10px;margin-bottom:10px;">' +
                    '<div style="font-weight:bold;">[' + escHtml(stage) + '] 任务：' + escHtml(tk) +
                    ' <span style="color:#888;font-size:0.85em;">' + escHtml(h.time) + '</span></div>' +
                    body + '<div style="margin-top:8px;">' + form + retryBtn + ignoreBtn + '</div></div>';
        });
        return html;
    }

    // 区块级 diff：每块各自比对数据签名，没变就不重建那块 DOM（保住输入框/选区）
    window._secSig = window._secSig || {};
    function sectionChanged(key, val) {
        var sig = JSON.stringify(val);
        if (window._secSig[key] === sig) return false;
        window._secSig[key] = sig;
        return true;
    }
    function setSection(id, key, val, builder) {
        if (!sectionChanged(key, val)) return;
        const el = document.getElementById(id);
        if (el) el.innerHTML = builder(val);
    }

    function refreshTasks() {
        return fetch('/api/tasks', { headers: { 'If-None-Match': window._tasksEtag || '' }, cache: 'no-store' })
            .then(response => { if (response.status === 304) return null; window._tasksEtag = response.headers.get('ETag') || ''; return response.json(); })
            .then(data => {
                if (!data) return;
                setSection('render-queue', 'render', data.render_queue, renderQueueHtml);
                setSection('merge-queue',  'merge',  data.merge_queue,  mergeQueueHtml);
                setSection('upload-queue', 'upload', data.upload_queue, uploadQueueHtml);
                setSection('clean-queue',  'clean',  data.clean_queue,  cleanQueueHtml);
                setSection('held-tasks',   'held',   data.held_tasks,   heldHtml);
                updateRemainingTimes();
                if (window.updateNavBadges) updateNavBadges(data.notifications);
            })
            .catch(error => console.error('Error refreshing tasks:', error));
    }

    function fmtRemaining(seconds) {
        if (seconds <= 0) return '0秒';
        const d = Math.floor(seconds / 86400);
        const h = Math.floor((seconds % 86400) / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = Math.floor(seconds % 60);
        if (d) return `${d}天${h}小时${m}分钟`;
        if (h) return `${h}小时${m}分钟${s}秒`;
        if (m) return `${m}分钟${s}秒`;
        return `${s}秒`;
    }
    function updateRemainingTimes() {
        const now = Date.now() / 1000;
        document.querySelectorAll('.remaining-time').forEach(el => {
            const executeAt = parseFloat(el.dataset.executeAt);
            el.textContent = fmtRemaining(executeAt - now);
        });
    }

    startPolling(updateRemainingTimes, 1000);
    startPolling(refreshTasks, 3000);
</script>
{% endblock %}
