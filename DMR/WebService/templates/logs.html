{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>控制台日志 <span id="log-status" style="font-size:0.8rem;font-weight:normal;color:#888;"></span></h2>
    <pre id="console-box" style="background:#111;color:#ddd;padding:12px;border-radius:6px;height:70vh;overflow-y:auto;font-family:Consolas,monospace;font-size:0.85rem;line-height:1.5;white-space:pre-wrap;word-break:break-all;margin:0;"></pre>
</div>

<script>
    const box = document.getElementById('console-box');
    const statusEl = document.getElementById('log-status');

    const MAX_LINES = 8000;   // 浏览器侧最多保留的行数（防 DOM 过大卡顿）；超出丢最老的
    let logLines = [];        // 当前显示的所有行
    let pending = [];         // 本帧待追加的行（合并多条一次性刷，扛突发）
    let flushScheduled = false;

    function flush() {
        flushScheduled = false;
        if (!pending.length) return;
        // 追加前先判断是否停在底部：在底部才自动跟随，往上翻历史时不打扰
        const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
        logLines.push(...pending);
        pending = [];
        if (logLines.length > MAX_LINES) logLines.splice(0, logLines.length - MAX_LINES);
        box.textContent = logLines.join('\n');
        if (atBottom) box.scrollTop = box.scrollHeight;
    }
    function scheduleFlush() {
        if (flushScheduled) return;
        flushScheduled = true;
        requestAnimationFrame(flush);
    }

    // SSE 实时日志：来一行推一行（EventSource 自带断线重连，不用手写）
    function connectLog() {
        const es = new EventSource('/api/console/stream');
        es.onopen  = () => { statusEl.textContent = '（实时）'; };
        es.onmessage = (e) => { pending.push(JSON.parse(e.data)); scheduleFlush(); };
        es.onerror = () => { statusEl.textContent = '（连接断开，自动重连…）'; };
    }
    connectLog();

    // 日志走 SSE 后，导航红点单独轻量轮询
    startPolling(() => {
        fetch('/api/notifications').then(r => r.json())
            .then(d => { if (window.updateNavBadges) updateNavBadges(d.notifications); })
            .catch(() => {});
    }, 3000);
</script>
{% endblock %}
