{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>控制台日志 <span id="log-status" style="font-size:0.8rem;font-weight:normal;color:#888;"></span></h2>
    <pre id="console-box" style="background:#111;color:#ddd;padding:12px;border-radius:6px;height:70vh;overflow-y:auto;overflow-x:hidden;font-family:Consolas,monospace;font-size:0.85rem;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;margin:0;"></pre>
</div>

<script>
    const box = document.getElementById('console-box');
    const statusEl = document.getElementById('log-status');

    const MAX_LINES = 8000;   // 浏览器侧最多保留的行数（防 DOM 过大卡顿）；超出丢最老的
    let logLines = [];        // 当前显示的所有行
    let pending = [];         // 本帧待追加的记录
    let flushScheduled = false;
    let firstId = null;
    let lastId = 0;
    let es = null;
    let loadingOlder = false;

    function flush() {
        flushScheduled = false;
        if (!pending.length) return;
        // 追加前先判断是否停在底部：在底部才自动跟随，往上翻历史时不打扰
        const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
        logLines.push(...pending.map(item => item.text));
        pending = [];
        if (logLines.length > MAX_LINES) logLines.splice(0, logLines.length - MAX_LINES);
        box.textContent = logLines.join('\n');
        if (atBottom) box.scrollTop = box.scrollHeight;
    }
    function scheduleFlush() {
        if (flushScheduled) return;
        flushScheduled = true;
        requestAnimationFrame(flush);
    }

    function applyHistory(records, replace) {
        if (!records.length) return;
        if (replace) {
            logLines = records.slice(-MAX_LINES).map(item => item.text);
        } else {
            logLines = records.map(item => item.text).concat(logLines);
            if (logLines.length > MAX_LINES) logLines.splice(MAX_LINES);
        }
        firstId = records[0].id;
        lastId = Math.max(lastId, records[records.length - 1].id);
        box.textContent = logLines.join('\n');
    }

    async function loadOlder() {
        if (loadingOlder || firstId === null || firstId <= 1) return;
        loadingOlder = true;
        try {
            const r = await fetch(`/api/console/history?before=${firstId}&limit=500`);
            const data = await r.json();
            const oldHeight = box.scrollHeight;
            applyHistory(data.lines || [], false);
            box.scrollTop += box.scrollHeight - oldHeight;
        } finally { loadingOlder = false; }
    }

    // SSE 实时日志：序号随每行发送，浏览器重连时带 Last-Event-ID。
    function connectLog() {
        if (es) es.close();
        es = new EventSource('/api/console/stream?last_id=' + encodeURIComponent(lastId));
        es.onopen  = () => { statusEl.textContent = '（实时）'; };
        es.addEventListener('history', (e) => {
            pending = [];
            applyHistory(JSON.parse(e.data), true);
            box.scrollTop = box.scrollHeight;
        });
        es.onmessage = (e) => {
            const item = JSON.parse(e.data);
            lastId = Math.max(lastId, item.id || 0);
            if (firstId === null) firstId = item.id;
            pending.push(item); scheduleFlush();
        };
        es.onerror = () => { statusEl.textContent = '（连接断开，自动重连…）'; };
    }
    async function loadInitialHistory() {
        try {
            const r = await fetch('/api/console/history?before=0&limit=20000');
            const data = await r.json();
            applyHistory(data.lines || [], true);
            box.scrollTop = box.scrollHeight;
        } catch (_) {
            // SSE 仍会补齐实时日志；失败时不阻塞日志页。
        }
        connectLog();
    }
    loadInitialHistory();
    box.addEventListener('scroll', () => { if (box.scrollTop < 20) loadOlder(); });
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            if (es) { es.close(); es = null; }
            statusEl.textContent = '（后台已暂停）';
        } else connectLog();
    });

    // 日志走 SSE 后，导航红点单独轻量轮询
    startPolling(() => {
        fetch('/api/notifications').then(r => r.json())
            .then(d => { if (window.updateNavBadges) updateNavBadges(d.notifications); })
            .catch(() => {});
    }, 3000);
</script>
{% endblock %}
