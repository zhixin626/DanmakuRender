<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DanmakuRender 5</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
      .nav-dot {
        display: none;
        width: 8px; height: 8px;
        background: #ff4d4f;
        border-radius: 50%;
        position: absolute;
        top: -3px; right: -11px;
      }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo" style="font-size: 1.5rem; font-weight: bold; color: var(--accent-color);">DanmakuRender 5</div>
            <div class="nav-links">
                <a href="{{ url_for('index') }}">任务</a>
                <a href="{{ url_for('tasks_page') }}" style="position:relative;">概况<span class="nav-dot" id="dot-failed"></span></a>
                <a href="{{ url_for('logs_page') }}" style="position:relative;">日志<span class="nav-dot" id="dot-logs"></span></a>
                <a href="{{ url_for('config_list') }}" style="position:relative;">配置<span class="nav-dot" id="dot-config"></span></a>
                <button id="btn-restart" onclick="triggerRestart()" style="background:none;border:none;color:#f0a500;padding:0;cursor:pointer;font-size:inherit;font-weight:bold;margin-left:20px;">重启</button>
                <a href="{{ url_for('logout') }}" style="color: #f0a500; margin-left:20px;">注销</a>
                <button id="btn-shutdown" onclick="triggerShutdown()" style="background:none;border:none;color:#ff6b6b;padding:0;cursor:pointer;font-size:inherit;font-weight:bold;margin-left:20px;">退出</button>
            </div>
        </nav>
    </header>
    <script>
    // ===== 统一轮询：切到后台标签暂停，切回前台立即刷新一次并恢复轮询 =====
    function startPolling(fn, interval) {
        var timer = null;
        function start() { if (timer) return; fn(); timer = setInterval(fn, interval); }
        function stop()  { if (timer) { clearInterval(timer); timer = null; } }
        document.addEventListener('visibilitychange', function () {
            if (document.hidden) stop(); else start();
        });
        if (!document.hidden) start();
        return { start: start, stop: stop, refresh: fn };
    }

    function _toggleDot(id, show) {
        var el = document.getElementById(id);
        if (el) el.style.display = show ? 'inline-block' : 'none';
    }

    // 导航红点：config/failed 为待办型(数量>0亮)；logs_err 为新消息型(localStorage 记已读)
    function updateNavBadges(n) {
        if (!n) return;
        _toggleDot('dot-config', (n.config || 0) > 0);
        _toggleDot('dot-failed', (n.failed || 0) > 0);
        var err = n.logs_err || 0;
        if (window.location.pathname === '/logs' && document.visibilityState === 'visible') {
            localStorage.setItem('seen_logs_err', String(err));   // 正在看日志页 = 已读
            _toggleDot('dot-logs', false);
        } else {
            var seen = parseInt(localStorage.getItem('seen_logs_err') || '0', 10);
            _toggleDot('dot-logs', err > seen);
        }
    }

    // 打开服务端机器的文件夹（mode=folder，走 AHK 复用窗口）或文件（mode=file，默认播放器）
    function openPath(path, mode) {
        if (!path) { alert('路径为空'); return; }
        fetch('/api/open', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ path: path, mode: mode || 'folder' })
        })
            .then(function (r) { return r.json(); })
            .then(function (d) { if (!d.ok) alert(d.message || '打开失败'); })
            .catch(function (e) { alert('请求失败: ' + e); });
    }
    window.openPath = openPath;

    function triggerRestart() {
        if (!confirm('确定要在所有任务完成后重启程序吗？')) return;
        const btn = document.getElementById('btn-restart');
        btn.disabled = true;
        btn.textContent = '等待中...';
        btn.style.color = '#aaa';
        fetch('/api/restart', { method: 'POST' })
            .then(r => r.json())
            .then(data => {
                btn.textContent = '已设置 ✓';
                btn.style.color = '#4caf50';
                setTimeout(() => {
                    btn.disabled = false;
                    btn.textContent = '重启';
                    btn.style.color = '#f0a500';
                }, 3000);
            })
            .catch(e => {
                alert('请求失败: ' + e);
                btn.disabled = false;
                btn.textContent = '重启';
                btn.style.color = '#f0a500';
            });
    }

    function triggerShutdown() {
        if (!confirm('确定要立即退出 DMR 程序吗？正在进行的录制会被中断！')) return;
        const btn = document.getElementById('btn-shutdown');
        btn.disabled = true;
        btn.textContent = '退出中...';
        btn.style.color = '#aaa';
        fetch('/api/shutdown', { method: 'POST' })
            .then(r => r.json())
            .then(data => {
                document.body.innerHTML = '<div style="text-align:center;margin-top:20vh;font-size:1.2rem;">程序已退出，正在关闭页面...</div>';
                window.open('', '_self'); window.close();   // 尝试关闭标签页（部分浏览器会拦截非脚本打开的标签）
            })
            .catch(e => {
                alert('请求失败: ' + e);
                btn.disabled = false;
                btn.textContent = '退出';
                btn.style.color = '#ff6b6b';
            });
    }
    </script>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="flash-messages">
              {% for category, message in messages %}
                <div class="flash-message flash-{{ category }}">{{ message }}</div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
