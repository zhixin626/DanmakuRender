# 程序内置的完整配置基线，不建议用户直接修改。
# 配置按 default.yml -> global.yml -> 任务 *.yml 的顺序递归覆盖：
# - default.yml：列出程序支持的完整结构、默认值和说明；
# - global.yml：只写这台机器或所有任务共用的覆盖项；
# - 任务配置：只写主播、平台和流程特有的覆盖项。
# 字段省略表示继承；显式写 ~ 表示把该字段覆盖为 null；列表会整体替换。

# 第三方工具路径。留空时自动查找或安装；仅在自动检测不正确时覆盖
executable_tools_path:
  ffmpeg: ~
  ffprobe: ~
  biliup: ~

# 主程序日志。WebUI 使用独立的内存日志流，不受这里的磁盘路径影响
logging_args:
  # 实例名称会写入日志文件名；留空时从配置目录推导（如 configs、configs_test）
  instance_name: ~
  # 相对路径以项目根目录为基准
  directory: ./logs
  # 控制台只显示 INFO 以上，日志文件记录 DEBUG 以上
  console_level: INFO
  file_level: DEBUG
  # 删除最后写入时间超过该天数的 DMR-*.log*；0 表示不按时间删除
  retention_days: 30
  # 容量清理时至少保护最近这些天的日志
  protected_days: 7
  # 日志目录中 DMR 主日志的总容量上限；0 表示不限制
  max_total_size_mb: 200
  # 单个进程日志达到该大小后轮转，最多保留3个备份；0 表示不轮转
  max_file_size_mb: 20
  # 启动时立即清理，此后按该间隔重复清理；0 表示只在启动时清理
  cleanup_interval_hours: 24

# DMR引擎参数
dmr_engine_args:
  # 选择组件
  # 可选：downloader（下载）, render（渲染）, uploader（上传）, cleaner（清理）, merger（合并）, webservice（WebUI）
  enabled_plugins: ['downloader', 'render', 'uploader', 'cleaner', 'merger']
  # 任务配置文件所在目录（目录下每个 *.yml 即一个任务，global.yml 除外；是否启用看文件内 enable 字段）
  config_path: ./configs

# 下载器插件目前没有独立核心参数，保留空字典供插件初始化
downloader_kernel_args: {}

# 各任务的流程开关。可在 global.yml 设置公共流程，再由单个任务覆盖
common_event_args:
  # 生成带弹幕视频；使用 render_args.overlay
  auto_render: false
  # 生成纯净转码视频；使用 render_args.transcode
  auto_transcode: false
  # 把任务指定的视频类型交给上传器
  auto_upload: false
  # 上传/流程结束后执行任务指定的清理规则
  auto_clean: false
  # 同一场直播结束后按 merge_args 合并录制分段
  auto_merge: false
  # 已完成或挂起的流程状态在内存中保留多久（小时），防止长期运行无限增长
  state_timeout_hours: 72

# 默认下载参数
download_args:
  # 直播录制
  live:
    # 直播间链接
    # 请填写标准格式链接，例如：https://live.bilibili.com/123456
    url:
    # 录制输出文件夹，设置为空则使用主播名称作为文件夹
    output_dir: ./直播回放
    # 录制文件名称模板
    # 可使用关键字替换，默认效果：飞天狙想要努力变胖-2023年3月1日20点30分，注意这里不能含有冒号，斜杠等非法字符！！
    output_name: '{STREAMER.NAME}-{CTIME.YEAR}年{CTIME.MONTH:02d}月{CTIME.DAY:02d}日{CTIME.HOUR:02d}点{CTIME.MINUTE:02d}分'
    # 录播分段时间（秒），默认一个小时
    segment: 3600

    # ============ 视频流录制参数 ============
    stream_args:
      # 是否录制直播流
      enable: True
      # 录制程序引擎，可选ffmpeg, streamgears, pyrequests 或者 streamlink
      # 在使用streamgears作为录制引擎时不支持录制B站hls流
      # 建议PC推流的直播使用ffmpeg录制，手机推流的直播使用streamgears录制
      # 录制twitch等特殊平台建议使用streamlink
      # streamlink可用平台请参考 https://streamlink.github.io/plugins.html
      # 默认为auto，由程序自动选择
      engine: auto
      # 录制视频容器格式，留空则由程序按实际引擎自动决定（streamgears→flv，ffmpeg录hls/fmp4→mp4）
      output_format:
      # 延迟下播计时（秒）
      # 使用这个功能可以把主播短暂下播又开播认定为同一场直播
      stop_wait_time: 7200
      # 直播流选项（使用streamlink录制时不生效）
      stream_option:
        # 直播流CDN
        # 对于虎牙直播，此项可选al, tx, hw等cdn服务器的缩写
        # 对于B站，可选特定的CDN域名前缀，例如：c1--cn-gotcha208
        # 或者正则匹配特定CDN，例如：.*cn-gotcha.*
        # 默认为空，使用B站接口返回的第一条地址（主线）
        stream_cdn: ~
        # 直播流类型（暂时只对B站生效）：
        #   留空：FLV-AVC > fMP4-AVC > HLS-TS-AVC > HEVC > AV1
        #   flv/fmp4/hls 或 avc/hevc/av1：提高该格式/编码的优先级，缺失时自动回退
        #   flv_only/fmp4_only/hls_only 或 avc_only/hevc_only/av1_only：严格限制
        #   type-codec（如 flv-avc、fmp4-hevc）：优先该精确组合
        # 注意HLS/fMP4流无法使用streamgears录制
        stream_type: ~
        # B站观看cookies，用于获取直播流，如果不填写则使用登录B站上传视频的cookies
        # 如果希望不登录录制最低画质，请设置为'None'
        bili_watch_cookies: .login_info/bili_watch_cookies.json
      # 高级视频录制参数（请确保你明白这些参数的含义后再修改）
      advanced_args:
        # 无法从直播流获得分辨率时的兜底值，不会强制缩放实际视频
        default_resolution: [1920, 1080]
        # 未开播时的常规检测间隔（秒）
        start_check_interval: 60
        # 疑似下播、等待 stop_wait_time 期间的检测间隔（秒）
        stop_check_interval: 60
        # 根据现实时间动态覆盖检测间隔。ranges 按顺序匹配，
        # 可用于临近常用开播时间时提高检测频率
        check_policy:
          enabled: false
          ranges: []
          # 示例：
          # ranges:
          #   - {start: '19:50', end: '20:10', interval: 10}
        # 仅在指定时间窗口内录制；空列表表示全天允许
        record_windows:
          ranges: []
          # 示例：[{start: '10:00', end: '17:00'}]
        # 到达此时刻后把本场直播视为下播；留空表示关闭
        force_offline_time: ~
        # 程序启动时发现主播已在播，是否把它视作一场直播的开头
        trust_onair_at_startup: true
        # 视频流异常后的重试等待：[初始秒数, 每次递增秒数, 最大秒数]
        # 也可填写单个数字，表示固定等待
        restart_interval: [0, 10, 60]
        # 文件名替换后的最大长度
        max_fn_length: 80
        # 小于该体积（MB）的视频与配套 JSONL 会被丢弃；~ 表示不检查
        min_video_size: 1
        # 小于该时长（秒）的视频与配套 JSONL 会被丢弃；~ 表示不检查
        min_video_duration: ~
        # 录制组编号，可用于多任务协同；留空时每场直播自动生成
        group_id: ~
        # ffmpeg 取流参数（仅 ffmpeg 下载引擎生效）
        ffmpeg_stream_args: [ '-rw_timeout','10000000',
                              '-analyzeduration','15000000',
                              '-probesize','50000000',
                              '-thread_queue_size', '16']
        # ffmpeg输出参数(仅ffmpeg下载引擎生效)。留空则由程序按容器/是否分段自动决定：
        #   mp4分段用 -segment_format_options movflags=+frag_keyframe+empty_moov（可边录边看且抗崩），
        #   mp4不分段用 -movflags +frag_keyframe+empty_moov，flv不加。显式填写则完全按你的来。
        ffmpeg_output_args: ~
        # 禁用下载速度慢时自动重启(仅ffmpeg下载引擎生效)
        disable_lowspeed_interrupt: false
        # pyrequests 录制 B 站时强制使用原始流地址
        bili_force_origin: true
        # streamlink 额外输入参数
        # 可用参数列表请参考 https://streamlink.github.io/cli.html
        # 一个典型的使用方法是添加一个--twitch-api-header参数，用于取消twitch直播流的广告
        # 特别提醒，使用此方法传入参数会在日志文件中明文显示，如果需要共享日志文件请确保删除了敏感信息！
        streamlink_extra_args: [
          "--twitch-disable-ads",     # 去广告，去掉、跳过嵌入的广告流
          "--twitch-disable-reruns",  # 如果该频道正在重放回放，不打开流
        ]
        # streamlink 画质名称，留空使用 best
        streamlink_quality: ~

    # ============ 弹幕参数 ============
    danmaku_args:
      # 是否连接弹幕服务器并为每段视频生成同名 JSONL
      enable: True
      # 只记录程序已识别且在此列出的事件类型；未知消息和 raw 永不写入正式文件
      record_types: [danmaku, gift, superchat, member]
      # 弹幕流选项
      stream_option:
        # 当前直播平台的弹幕 Cookie 文件；留空时按平台默认方式连接
        # B站使用登录导出的 Cookie JSON；抖音使用 Cookie 字典 JSON
        # 抖音 Cookie 用于特殊情况下录制弹幕(https://github.com/SmallPeaches/DanmakuRender/issues/258)
        # 特别提醒，使用此方法传入参数会在日志文件中明文显示，如果需要共享日志文件请确保删除了敏感信息！
        dm_cookie_path: ~
      # 高级弹幕录制参数（请确保你明白这些参数的含义后再修改）
      advanced_args:
        # 弹幕超时自动重启（秒），超过一段时间无弹幕会自动重启弹幕录制，0表示关闭
        dm_auto_restart: 300
        # 为正确处理分段边界，最近若干秒事件暂存在内存，正常停止会全部写入
        event_tail_window: 15
      # 当前进程的本场直播结束时，从分段 JSONL 生成营收统计
      statistics:
        enable: False
        types: [gift, superchat, member]
        rank_top_n: 3

  # 视频下载
  videos:
    # 需要下载的视频链接
    # 可以是UP主主页，播放列表，合集等
    url: 
    # 录制输出文件夹
    output_dir: ./视频下载
    # 录制文件名称格式
    # 默认为 视频标题.视频格式，例如：【2024LPL春季赛】2月7日 IG vs RNG.mp4
    # 如果下载B站用户主页视频（https://space.bilibili.com/<mid> 格式的链接），则可以使用关键字替换，例如 {STREAMER.NAME}-{TITLE}
    # 如果下载其他的B站视频，例如合集，播放列表等，则应该设置yutto的输出格式，例如 {title}/{name}
    # 具体请参考 https://github.com/yutto-dev/yutto?tab=readme-ov-file#已支持的下载类型
    # 如果使用yt-dlp下载其他平台的视频，应该使用yt-dlp的输出格式，例如 '%(title)s.%(ext)s'
    # 具体请参考 https://github.com/yt-dlp/yt-dlp?tab=readme-ov-file#output-template
    output_name: ~
    # 下载引擎
    # B站视频默认使用yutto，其他平台默认使用yt-dlp
    engine: ~
    # 视频质量，默认可用的最高画质
    # 此参数将被直接传入下载引擎，具体可用值请参考相关文档
    quality: ~
    # 登录账号名称，程序依靠这个来识别不同的账号
    # 下载B站时，不登录只能下载480P视频，登录但是不是大会员只能下1080P30的视频
    # 其他平台暂不生效
    account: bilibili
    # 登录cookies路径
    # 如果设置为空将会保存到./login_info/{ACCOUNT}.json
    cookies: ~
    # 下载视频的起始时间，设置格式为'YYYY-MM-DD HH:MM:SS'，例如'2024-01-01 00:00:00'
    # 如果设置为空将从当前时间开始下载之后的新视频
    # YouTube视频只能精确到天，例如设置为'2024-01-01 12:00:00'仍然会从0点开始下载
    start_time: ~
    # 下载视频的结束时间
    # 一般情况下应该设置为空
    end_time: ~
    # 是否下载弹幕
    # 仅对B站视频有效
    danmaku: False
    # 是否下载字幕
    # 仅对B站视频有效，如果yt-dlp需要字幕请在extra_args中添加相应参数
    subtitle: False
    # 检测更新时长（秒），默认600
    # 每隔这么长时间检测一次是否有新视频
    check_interval: 600
    # 下载超时时间（秒）
    # 如果一次下载超过此时间没有结束，将会被强制终止
    subprocess_timeout: 86400
    # 附加参数列表
    # 此参数将直接传入下载引擎，可以用来设置一些特殊的下载参数
    extra_args: []

  # 监视本地目录，把外部程序写入的视频当作录制分段送入后续流程
  virtual:
    # 外部视频所在目录
    input_dir: ~
    # DMR 接管后的视频输出目录
    output_dir: ~
    # 匹配视频文件名的模式
    video_pattern: ~
    # 从文件名提取主播、标题和时间的信息
    info_pattern:
      name: ~
      title: ~
      time_str: ~
      time_format: ~
      danmaku: true
    # 文件出现后等待写入稳定的时间（秒）
    segment_wait_time: 3
    # 没有新分段多久后判定一场输入结束（秒）
    stop_wait_time: 10
    # 只接收此时间之后的文件；留空表示程序启动时间
    start_time: ~
    advanced_video_args:
      # 小于该体积（MB）的文件不进入后续流程
      min_video_size: 1
      # 小于该时长（秒）的文件不进入后续流程
      min_video_duration: ~
    # 附加到 VideoInfo 的自定义信息
    extra_info: ~

# 渲染器核心参数
render_kernel_args:
  # 同时执行的渲染/转码任务数。emoji_dmrender 单个任务内部固定整段单路渲染；
  # 多个任务同时执行时，显存和CPU占用仍会叠加
  nrenders: 1

# 渲染器默认参数
render_args:
  # 纯净转码：不读取 JSONL，也不叠加弹幕
  transcode:
    # 留空时在原视频目录生成“转码后”文件
    output_dir: ~
    output_name: ~
    # 输出容器
    format: mp4
    # 失败后的重试次数
    retry: 3
    # 输入视频的解码方式，与下面的输出编码器相互独立：
    #   auto/true：由 FFmpeg 自动选择可用的硬件解码（推荐）
    #   false/~：关闭硬件解码，改用 CPU
    #   cuda：NVIDIA GPU 解码；qsv：Intel 核显解码
    # 使用 copy 直接复制视频流时不会发生解码，此项没有实际作用
    hwaccel: auto
    # 输出视频编码器，可按硬件和兼容性选择：
    #   hevc_nvenc：NVIDIA GPU 编码 HEVC/H.265，体积较小
    #   h264_nvenc：NVIDIA GPU 编码 H.264，兼容性更好
    #   hevc_qsv/h264_qsv：Intel 核显编码
    #   hevc_amf/h264_amf：AMD GPU 编码
    #   libx265/libx264：CPU 编码，通常更慢
    #   copy：不重新编码，直接复制原视频流；缩放时不能使用
    vencoder: h264_nvenc
    # 传给视频编码器的附加参数；例如 [-b:v, 6M] 表示目标视频码率 6 Mbps
    vencoder_args: [-b:v, 15M]
    # 音频编码器：aac 表示重新编码；copy 表示直接复制原音频流
    aencoder: aac
    # 例如 [-b:a, 160K] 表示目标音频码率 160 kbps；aencoder 为 copy 时应写 []
    aencoder_args: [-b:a, 320K]
    # 输出尺寸：~ 保持原尺寸；1.5 表示按比例缩放；也可写 3840x2160
    output_resize: ~

  # 弹幕叠加：先由 LayoutCompiler 把 JSONL 编译成渲染计划，再交给渲染引擎
  overlay:
    # dmrender：纯 libass；emoji_dmrender：彩色表情；gpu_render：GPU 解码、叠加和编码
    engine: dmrender
    # 留空时在原视频目录生成“弹幕版”文件
    output_dir: ~
    output_name: ~
    format: mp4
    retry: 3
    # 输入视频的解码方式，与下面的输出编码器相互独立：
    #   auto/true：由 FFmpeg 自动选择可用的硬件解码（推荐）
    #   false/~：关闭硬件解码，改用 CPU
    #   cuda：NVIDIA GPU 解码；qsv：Intel 核显解码
    hwaccel: auto
    # 弹幕叠加后必须重新编码，不能使用 copy：
    #   hevc_nvenc：NVIDIA GPU 编码 HEVC/H.265，体积较小
    #   h264_nvenc：NVIDIA GPU 编码 H.264，兼容性更好
    #   hevc_qsv/h264_qsv：Intel 核显编码
    #   hevc_amf/h264_amf：AMD GPU 编码
    #   libx265/libx264：CPU 编码，通常更慢
    vencoder: h264_nvenc
    # 传给视频编码器的附加参数；例如 [-b:v, 6M] 表示目标视频码率 6 Mbps
    vencoder_args: [-b:v, 15M]
    # GPU 引擎读取 vencoder_args 中 -b:v、-maxrate、-bufsize；未配置的项使用编码器默认值。
    # 音频无需叠加弹幕，可选择 aac 重新编码或 copy 直接复制
    aencoder: aac
    # 例如 [-b:a, 160K]；aencoder 为 copy 时应写 []
    aencoder_args: [-b:a, 320K]
    # ~ 保持原尺寸；数字表示缩放倍率；WxH 表示目标分辨率
    output_resize: ~

    # 所有渲染后端统一使用1080p横屏/竖屏画布；等比缩放并补黑边
    # 宽 >= 高使用1920x1080，高 > 宽使用1080x1920；default关闭，由global/任务按需开启
    rescale_to_1080p: false
    # auto按当前源判断；adaptive在当前比例接近方形时参考上一段
    # 也可用portrait或landscape强制固定方向
    rescale_orientation: auto

    # 以下参数适用于 emoji_dmrender 和 gpu_render
    # 输出帧率取源帧率的最小整数倍，使其不低于此值（25→50、30→60）；~ 跟随源帧率
    min_fps: 50
    # 表情包目录；留空时按 JSONL 平台使用 ./emoji_pack/<platform>
    emoji_pack: ~
    # Pillow 绘制表情弹幕使用的字体；留空时自动选择
    emoji_font: ~
    # 轨道是第一层，事件类型嵌套在所属轨道中。
    r2l:
      # 固定滚动速度，单位像素/秒（以1080p画布为准）；横竖屏和长短弹幕相同
      # 留空时用1920 / screen_duration换算，保留旧配置的横屏效果
      speed: ~
      # 兼容旧配置：移动横屏1920像素所需秒数；设置speed后此项不生效
      screen_duration: 8
      # 从 margin_top 以下可供 R2L 使用的垂直比例，范围 0~1
      vertical_ratio: 0.3
      margin_top: 10px
      vertical_gap: 10px
      horizontal_gap: 15px

      danmaku:
        enable: true
        font: Microsoft YaHei
        fontsize: 36
        opacity: 0.8
        outline_color: '#000000'
