uploader_kernel_args:
  # 指定同时执行的上传任务数，默认1
  nuploaders: 1

# 上传器默认参数
upload_args:
  # 上传到B站
  bilibili:
    # 上传引擎：biliuprs（命令行）或 biliwebapi（网页接口，支持合集和仅记录元数据）
    engine: biliuprs
    # 上传账号名称，程序依靠这个来识别不同的账号，如果打算传不同账号就要设置不同的名称
    account: bilibili
    # 上传cookies路径，如果设置为空将会保存到./login_info/{ACCOUNT}.json
    cookies: ~
    # 任务级上传锁，此功能保证同一个任务中的上传是串行的从而保证视频顺序，默认True
    # 如果设置为False，那么除第一个视频外其他所有上传任务将会完全并行
    # 对非实时上传的任务无效
    task_upload_lock: True
    # 重试次数，如果上传遇到错误将会重试，设置为0表示不重试
    # 注意：重试会整个视频重传，并且阻塞后面视频的上传，不应该设置太大
    retry: 3
    # 上传超时时间（秒），如果上传时间超过这个时间将会被强制终止（用于防止biliup卡死），0表示不限制
    timeout: 0
    # 实时上传（边录边传），每录制一个分段上传一次，同一场直播的不同分P仍然会在一个视频下，默认开启
    # 注意：实时上传可能无法上传很短的视频，尤其是在网速较快的情况下（B站对修改稿件的间隔有限制）
    realtime: True
    # 以下参数来自biliuprs，详细内容可以参考 https://biliup.github.io/biliup-rs/index.html
    # 上传线路，设置为空则由biliuprs自动选择
    line: ~
    # 上传线程数
    limit: 3
    # 是否为转载视频 1-自制 2-转载
    copyright: 1
    # 转载来源，转载视频必填
    source: ''
    # 分区号，分区参考 https://biliup.github.io/tid-ref.html
    tid: 65
    # 封面模式：extract_frame / render_template / render_text / render_on_frame / render_text_on_frame / 空
    # mode 为空时使用 path；动态生成失败时也会回退到 path
    cover:
      mode: extract_frame
      # render_on_frame / render_text_on_frame 可直接使用已有图片；留空时自动抽帧
      frame_path: ~
      path: ''
      frame_opacity: 0.2
      # 所有文字渲染模式：-1 左对齐，0 居中，1 右对齐
      edge: 0
      name: '{STREAMER.NAME}'
      name_color: '#FFFFFF'
      time_template: '{stime.month}月{stime.day}日'
      # year: '{stime.year}'
      # render_text / render_text_on_frame 使用以下两个数组；一个颜色会应用到全部文字
      # texts: ['第一行', 'vs', '第三行']
      # colors: ['#FFFFFF', '#FF99FF', '#FFFFFF']
      # transparent: false  # 仅 render_text 使用；true 时输出透明背景
      ratio: 16/9
      sample_count: 10
    # 标题，可以使用关键字替换
    # 默认的例子：[飞天狙想要努力变胖/直播回放] 晚上七点半比赛 2023年2月24日 （带弹幕版）
    title: '[{STREAMER.NAME}/直播回放] {TITLE} {CTIME.YEAR}年{CTIME.MONTH:02d}月{CTIME.DAY:02d}日'
    # 简介，可以使用关键字替换
    desc: |
      {STREAMER.NAME} 的直播回放
      标题：{TITLE} 
      时间：{CTIME.YEAR}年{CTIME.MONTH:02d}月{CTIME.DAY:02d}日
      直播地址：{STREAMER.URL} 

      ————————————
      由DanmakuRender录制：
      https://github.com/SmallPeaches/DanmakuRender
    # 动态内容，可以使用关键字替换
    dynamic: '{STREAMER.NAME} 的直播回放，{CTIME.YEAR}年{CTIME.MONTH:02d}月{CTIME.DAY:02d}日'
    # 标签（一定要有！多个标签逗号分割）
    tag: '直播回放'
    # 延迟发布，单位秒，如果需要的话至少设置14400秒（4个小时）
    dtime: 0
    # 是否开启杜比音效? 0-关闭 1-开启
    dolby: 0
    # 允许转载? 0-允许转载，1-禁止转载
    no_reprint: 1
    # 是否尽自己可见? 0-否 1-是
    is_only_self: 0
    # 以下参数主要由 biliwebapi 使用
    # 跳过真实上传，只生成/更新本地稿件元数据；适合先合并、后统一上传的流程
    skip_upload: false
    # 是否把稿件信息写入本地 metadata 记录
    record_metadata: false
    # 是否把新稿件加入指定合集
    add_to_list: false
    season_id: ~
    # 按天或按月查找历史稿件并追加分P；可选 daily / monthly / ~
    auto_append_period: ~
    # 周期追加已有稿件时，每个上传任务只附加一次；{p_n} 表示本次任务对应的分P（如 p2,p3）
    # 分隔线由 append_desc 自己配置；为空则不追加，合并后最多2000字符
    append_desc: ~
    # 免打扰参数
    no_disturbance: 0
    # B站投稿水印：0-关闭，1-开启；接口中会转换为 watermark.state
    watermark: 0
    # 是否从个人空间隐藏稿件：0-不隐藏，1-隐藏
    space_hidden: 0
    # biliwebapi 其他尚未正式建模的透传字段
    extra_kwargs: {}
  
  # 上传到YouTube
  # 此功能使用较复杂，细节请参考文档
  youtube:
    # 上传引擎，目前只支持youtubev3 (Google API v3 for Youtube)
    engine: youtubev3
    # 应用程序密钥路径
    client_secrets: .login_info/client.json
    # Google账号名称
    # 也可以直接指向已授权的Oauth2文件路径
    account: .login_info/google-oauth2.json
    # Google账号验证选项
    # 例如：在服务器上无GUI验证时，应设置为['--noauth_local_webserver']
    credential_args: ~
    # 重试次数，如果上传遇到错误将会重试，设置为0表示不重试
    # 特别提示：此重试会完全重传视频并消耗API配额（除非由于配额不够失败），需要断点续传请设置下面的参数
    retry: 0
    # 断点续传次数，此次数为单次上传中断点续传的次数，设置为0表示无限续传，直到上传完成或者API返回错误
    # 强烈建议设置无限续传，否则完全重传需要消耗API配额，并且未上传成功的视频需要自己到YouTube页面删除
    retry_resume: 0
    # 上传超时时间（秒），如果上传时间超过这个时间将会被强制终止（用于防止卡死），0表示不限制
    timeout: 0
    # 实时上传（边录边传），每录制一个分段上传一次，youtube默认关闭
    realtime: False
    # 是否合并视频
    # 如果设置为True，那么会把所有分段视频合并成一个视频再上传，默认True
    # 使用实时上传时此功能不生效
    # 强烈建议关闭实时上传，并启动合并视频再上传，因为YouTube API默认每天只能上传6个视频
    # 使用此功能请确保延迟下播时间设置较短，否则不同分辨率的视频合并会导致上传失败
    concat_video: True
    # 以下参数来自Google API，部分选项请参考 https://developers.google.com/youtube/v3/docs/videos/insert
    # 标题，可以使用关键字替换
    # 默认的例子：[飞天狙想要努力变胖/直播回放] 晚上七点半比赛 2023年2月24日 （带弹幕版）
    title: '[{STREAMER.NAME}/直播回放] {TITLE} {CTIME.YEAR}年{CTIME.MONTH:02d}月{CTIME.DAY:02d}日'
    # 简介，可以使用关键字替换
    desc: |
      {STREAMER.NAME} 的直播回放
      标题：{TITLE} 
      时间：{CTIME.YEAR}年{CTIME.MONTH:02d}月{CTIME.DAY:02d}日
      直播地址：{STREAMER.URL} 

      ————————————
      由DanmakuRender录制：
      https://github.com/SmallPeaches/DanmakuRender
    # 视频标签，多个标签逗号分割，例如：'直播回放,ABC'
    # Youtube的视频标签可以为空
    tag: ~
    # 视频分区编号，默认20（游戏）
    # 请参考 https://developers.google.com/youtube/v3/docs/videoCategories/list?hl=zh-cn
    # 或者 https://gist.github.com/dgp/1b24bf2961521bd75d6c
    category: 20
    # 延迟发布（秒）（此功能暂不可用）
    # 延迟时间从上传启动时开始计算，使用延迟上传时privacy固定为private
    dtime: 0
    # 隐私设置，可选：public（公开）, unlisted（未列出）, private（私有），默认public
    privacy: public
    # 完全自定义上传请求（https://developers.google.com/youtube/v3/docs/videos/insert?hl=zh-cn#request-body）
    # 应设置为json格式字符串，可使用关键字替换
    raw_upload_body: ~

  # 上传到 AcFun
  acfun:
    engine: acfun
    account: acfun
    login_info: ~
    retry: 0
    realtime: False
    channel_id: 218
    creation_type: 3
    copyright: 1  # 1: 自制原创, 0: 转载
    watermark_position: 3   # 水印位置 0-3
    watermark_signature: false
    # AcFun 默认直接从视频抽帧作为封面
    cover:
      mode: extract_frame
      # render_on_frame 可直接使用已有图片；留空时从待上传视频自动抽帧
      frame_path: ~
      path: ''
      frame_opacity: 0.2
      name: '{STREAMER.NAME}'
      name_color: '#FFFFFF'
      time_template: '{stime.month}月{stime.day}日'
      ratio: 16/9
      sample_count: 10
    tag: []
    dynamic: ''
    title: '[{STREAMER.NAME}/直播回放] {TITLE} {CTIME.YEAR}年{CTIME.MONTH:02d}月{CTIME.DAY:02d}日'
    desc: |
      {STREAMER.NAME} 的直播回放
      标题：{TITLE}
      时间：{CTIME.YEAR}年{CTIME.MONTH:02d}月{CTIME.DAY:02d}日
      直播地址：{STREAMER.URL}

  # 完全自定义上传
  # 调用的上传程序应该在上传成功后返回0，失败返回非0，并将错误信息输出到stderr
  # 具体说明请参考GitHub文档
  custom:
    # 上传引擎，目前只支持子进程调用
    engine: subprocess
    # 重试次数，如果上传遇到错误将会重试，设置为0表示不重试
    # 注意：重试会整个视频重传，并且阻塞后面视频的上传，不应该设置太大
    retry: 3
    # 上传超时时间（秒），如果上传时间超过这个时间将会被强制终止（用于防止卡死），0表示不限制
    timeout: 0
    # 上传命令行参数，可以使用关键字替换
    # 为保证安全调用，请使用参数列表的形式，例如：['python', 'upload.py', '{PATH}']
    command: ~

# 清理器核心参数
cleaner_kernel_args:
  # 程序启动时恢复上次异常退出后仍未完成的延迟清理任务
  resume_pending: true

# 清理器默认参数
# 这里定义“清理方法”的公共参数；任务配置再以文件类型为键选择 method。
# 任务清理条目可选 trigger: onRenderEnd / onUploadEnd / onMergeEnd / onLiveEnd；
# 不写时程序根据已启用流程自动选择最后一个消费阶段。
clean_args:
  # 移动文件
  move:
    # 目标文件夹，可以使用关键字替换，文件夹不存在会自动创建
    # 如果设置为"*TRASHBIN*"，那么文件将会被移动至回收站（需要操作系统支持）
    dest: ~
    # 清理延迟（秒），在上传完成后会过一段时间再清理，下同
    # 如果指定多个清理任务，不同清理任务的延迟并不顺延，均会在上传完成后的指定时间后清理
    delay: 86400
    # 清理弹幕视频时同时清理原文件，默认false，下同
    # 特别注意：应该只在不上传原文件的情况下使用此选项，否则可能会导致原视频上传失败
    w_srcfile: False
    # 清理原文件时同时清理转码前文件（如果有的话），默认true，下同
    w_srcpre: True
  # 复制文件
  copy:
    dest: ~
    delay: 0
    w_srcfile: False
    w_srcpre: True
  # 删除文件
  delete:
    delay: 172800
    w_srcfile: False
    w_srcpre: True
  # 移入系统回收站，可恢复；任务配置中的 method 写 send2trash
  send2trash:
    delay: 172800
    w_srcfile: False
    w_srcpre: True
  # 自定义命令
  custom: 
    # 命令行参数，可以使用关键字替换
    # 为保证安全调用，请使用参数列表的形式，例如：['rm', '-rf', '{PATH}']
    command: ~
    # 是否等待命令执行完成
    # 如果设置为false，那么程序会立即执行下一个清理任务，不会等待命令执行完成
    # 注意：程序自带的其他清理方式均为同步执行(wait=True)
    wait: True
    delay: 0
    w_srcfile: False
    w_srcpre: True

# 录制分段合并参数（可选，按 group_id 把同场直播的多个分段合并）
# 开关在 common_event_args.auto_merge；这里只放合并的具体参数。
# 分辨率一致的连续分段无损合并成一个文件；分辨率不一致时不做重编码，
# 按「连续同分辨率」分成多个文件（单独的段直通复制），按时间顺序依次上传
merge_args:
  # 要合并的视频类型，可选 src_video / dm_video，可多选，例如 ['dm_video']
  merge_type: ~
  # 是否对合并后的音频做增益
  is_amplify: False
  # 增益分贝数（is_amplify 为 True 时生效）
  extra_gain_db: 0
  # 合并后输出文件名模板，可用 {stime} 占位，例如 {stime.month:02d}月{stime.day:02d}日；
  # 因分辨率不一致产出多个文件时，自动按时间顺序追加 _part1/_part2 序号
  file_name_template: "{stime.month}月{stime.day}日"
  # 全部合并成功后是否由 merger 删除被合并的源文件（send2trash 回收站）。
  # false 则保留源文件、交给 cleaner 按 clean_args 统一清理
  remove_source: True
  # 合并失败的重试次数（用尽后挂起转入 WebUI 人工处理队列）
  retry: 3

# 合并器插件目前没有独立核心参数
merger_kernel_args: {}

# Bark 推送通知参数（可选）
bark_args:
  # 是否开启 Bark 推送，默认关闭
  is_bark: False
  # 推送提示音
  sound: birdsong

webservice_kernel_args:
  # 是否启动 WebUI/API
  web_api: true
  # 监听地址。0.0.0.0 允许局域网访问；只允许本机时使用 127.0.0.1
  host: 127.0.0.1
  port: 5000
  # 是否要求登录。开放到局域网时建议设为 true 并修改账号密码
  force_login: true
  username: admin
  password: admin
  # 打开文件夹用的 AutoHotkey 脚本路径（复用资源管理器窗口）；留空则用系统默认方式打开
  folder_opener_ahk: ~
  # AutoHotkey 可执行程序路径，留空自动探测
  ahk_exe: ~
