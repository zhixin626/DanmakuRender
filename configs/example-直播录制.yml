enable: false
common_event_args:
  auto_render: true
  auto_upload: true
  auto_clean: true
  auto_transcode: false
  state_timeout_hours: 72
download_args:
  dltype: live
  url: https://live.bilibili.com/21247078
  output_dir: ./直播回放
  output_name: '{STREAMER.NAME}-{CTIME.YEAR}年{CTIME.MONTH:02d}月{CTIME.DAY:02d}日{CTIME.HOUR:02d}点{CTIME.MINUTE:02d}分'
  segment: 3600
  stream_args:
    enable: true
    engine: auto
    output_format: flv
    stop_wait_time: 5
  danmaku_args:
    enable: true
    format: ass
    danmaku:
      render:
        enable: true
        margin_h: 6
        margin_w: 12
        dmrate: 0.4
        font: Microsoft YaHei
        fontsize: 36
        dst: 20
        dmduration: 16
        opacity: 0.8
        auto_fontsize: true
        outlinecolor: 0
        outlinesize: 1.0
      filter:
        keywords: null
        username: null
        max_length: 0
    gift:
      render:
        enable: false
    superchat:
      render:
        enable: false
    member:
      render:
        enable: false
upload_args:
  src_video:
    account: bilibili
    cookies: null
    retry: 3
    realtime: true
    min_length: 120
    line: null
    limit: 3
    copyright: 1
    source: ''
    tid: 65
    cover: ''
    title: '[{STREAMER.NAME}/直播回放] {TITLE} {CTIME.YEAR}年{CTIME.MONTH:02d}月{CTIME.DAY:02d}日'
    desc: "{STREAMER.NAME} 的直播回放\n标题：{TITLE} \n时间：{CTIME.YEAR}年{CTIME.MONTH:02d}月{CTIME.DAY:02d}日\n直播地址：{STREAMER.URL} \n\n————————————\n由DanmakuRender录制：\nhttps://github.com/SmallPeaches/DanmakuRender\n"
    dynamic: '{STREAMER.NAME} 的直播回放，{CTIME.YEAR}年{CTIME.MONTH:02d}月{CTIME.DAY:02d}日'
    tag: 直播回放
    dtime: 0
    no_reprint: 1
  dm_video:
    account: bilibili
    cookies: null
    retry: 3
    realtime: true
    min_length: 120
    line: null
    limit: 3
    copyright: 1
    source: ''
    tid: 65
    cover: ''
    title: '[{STREAMER.NAME}/直播回放] {TITLE} {CTIME.YEAR}年{CTIME.MONTH:02d}月{CTIME.DAY:02d}日 (弹幕版)'
    desc: "{STREAMER.NAME} 的直播回放\n标题：{TITLE} \n时间：{CTIME.YEAR}年{CTIME.MONTH:02d}月{CTIME.DAY:02d}日\n直播地址：{STREAMER.URL} \n\n————————————\n由DanmakuRender录制：\nhttps://github.com/SmallPeaches/DanmakuRender\n"
    dynamic: '{STREAMER.NAME} 的直播回放，{CTIME.YEAR}年{CTIME.MONTH:02d}月{CTIME.DAY:02d}日'
    tag: 直播回放
    dtime: 0
    no_reprint: 1
clean_args:
  all:
    method: delete
    dest: null
    delay: 86400
    w_srcfile: false
    w_srcpre: true
