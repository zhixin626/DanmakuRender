# 本机及所有录制任务共用的覆盖配置。
# 完整字段、默认值和说明见 DMR/Config/default.yml；
# 此处省略的字段自动继承 default.yml。

dmr_engine_args:
  enabled_plugins: [downloader, render, uploader, cleaner, webservice, merger]
  config_path: ./configs

# 八个任务默认都执行：弹幕渲染、上传、清理和分段合并。
# 只做纯净转码的任务在自己的配置中覆盖前两项。
common_event_args:
  auto_render: true
  auto_transcode: false
  auto_upload: true
  auto_clean: true
  auto_merge: true

download_args:
  live:
    output_name: '{CTIME.MONTH}月{CTIME.DAY}日{CTIME.HOUR:02d}点{CTIME.MINUTE:02d}分'
    segment: 7200
    stream_args:
      stop_wait_time: 120
      advanced_args:
        start_check_interval: 60
        stop_check_interval: 60
        restart_interval: [0, 1, 20]
        min_video_size: 0.5
        min_video_duration: 3
    danmaku_args:
      statistics:
        enable: true
        types: [gift, superchat, member]
        rank_top_n: 10

render_args:
  # 纯净转码任务直接封装为 MP4，不重新编码音视频。
  transcode:
    hwaccel: false
    vencoder: copy
    vencoder_args: []
    aencoder: copy
    aencoder_args: []
    output_resize: ~

  overlay:
    engine: emoji_dmrender
    vencoder: hevc_nvenc
    vencoder_args: [-b:v, 4M]
    aencoder_args: [-b:a, 128K]
    danmaku:
      font: Microsoft YaHei
      fontsize: 60
      opacity: 0.78
      max_width: 60char
    gift:
      duration: 30
      min_price_cny: 3
    member:
      duration: 30
    r2l:
      duration: 8
      vertical_ratio: 0.3
      margin_top: 10px
      vertical_gap: 10px
      horizontal_gap: 12px
    slide_left:
      width: 18%
      margin_left: 10px
      margin_bottom: 10px
    slide_right:
      width: 18%
      margin_right: 10px
      margin_bottom: 10px

upload_args:
  bilibili:
    engine: biliwebapi
    account: b站_不可一世冷狗
    retry: 3
    realtime: false
    line: ~
    limit: 3
    copyright: 1
    source: ''
    dtime: 0
    no_reprint: 1
    is_only_self: 0
    no_disturbance: 0
    auto_append_period: daily
    cover_args:
      is_render_cover: true
      is_extract_frame: false
      time_template: '{stime.month}月{stime.day}日'
      ratio: 16/9
      sample_count: 10
    desc: |
      主播：{STREAMER.NAME}
      标题：{TITLE}
      开播：{STIME.YEAR:02d}年{STIME.MONTH:02d}月{STIME.DAY:02d}日{STIME.HOUR:02d}点{STIME.MINUTE:02d}分
      下播：{ETIME.YEAR:02d}年{ETIME.MONTH:02d}月{ETIME.DAY:02d}日{ETIME.HOUR:02d}点{ETIME.MINUTE:02d}分
      时长：{TOTALTIME}
      地址：{STREAMER.URL}
      录制：https://github.com/SmallPeaches/DanmakuRender
      礼物：{revenue_summary}
      排名：{top_ranking}

  acfun:
    account: A站_不可一世冷狗3
    retry: 3
    realtime: false
    channel_id: 218
    creation_type: 3
    copyright: 1
    watermark_position: 3
    watermark_signature: false
    desc: |
      主播：{STREAMER.NAME}
      标题：{TITLE}
      开播：{STIME.YEAR:02d}年{STIME.MONTH:02d}月{STIME.DAY:02d}日{STIME.HOUR:02d}点{STIME.MINUTE:02d}分
      下播：{ETIME.YEAR:02d}年{ETIME.MONTH:02d}月{ETIME.DAY:02d}日{ETIME.HOUR:02d}点{ETIME.MINUTE:02d}分
      时长：{TOTALTIME}
      地址：{STREAMER.URL}
      录制：https://github.com/SmallPeaches/DanmakuRender
      礼物：{revenue_summary}
      排名：{top_ranking}

cleaner_kernel_args:
  resume_pending: true

clean_args:
  delete:
    delay: 43200
  send2trash:
    delay: 43200

merge_args:
  file_name_template: '{stime.month:02d}月{stime.day:02d}日'
  remove_source: true

bark_args:
  is_bark: true
  sound: silence

webservice_kernel_args:
  web_api: true
  host: 0.0.0.0
  port: 5000
  force_login: false
  folder_opener_ahk: C:/Users/zhixin/Documents/AutoHotkey/filexplorer.ahk
  ahk_exe: ~
