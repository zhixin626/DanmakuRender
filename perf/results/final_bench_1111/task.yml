enable: true

common_event_args:
  auto_render: true
  auto_transcode: false
  auto_upload: false
  auto_clean: true
  auto_merge: true

bark_args:
  is_bark: true
  sound: silence

merge_args:
  merge_type: [dm_video]
  is_amplify: true
  extra_gain_db: 20

render_args:
  overlay:
    engine: gpu_render
    vencoder_args: [-b:v, 6M]
    r2l:
      danmaku:
        vip_users:
          '41694436': ~
          '31831236': ~ #喵喵硝
          '324941243': ~ #想想也不错
    # slide_right:
    #   margin_bottom: 22px

download_args:
  dltype: live
  url: https://live.douyin.com/32570942936
  output_dir: Tasks文件/不可一世杀手
  stream_args:
    advanced_args:
      default_resolution: [1920,1080]
      check_policy:
        enabled: true
        ranges:
          - {start: '23:00', end: '23:10', interval: 15}
  danmaku_args:
    stream_option:
      dm_cookie_path: .login_info/抖音_nb的饼干.json

upload_args:
  dm_video:
    target: bilibili
    account: b站_不可一世冷狗
    tid: 172
    cover:
      mode: render_template
      name: 不可一世杀手
      name_color: '#83C167'
    title: 【手儿】{STIME.MONTH}月{STIME.DAY}日直播回放(弹幕版)
    dynamic: |
      松弟萌,手儿,{STIME.YEAR}年{STIME.MONTH}月{STIME.DAY}日的直播回放来了!
    tag: 不可一世杀手,王者荣耀,直播回放,搞笑
    add_to_list: true
    season_id: 6991695
    auto_append_period: daily
    watermark: 0
    space_hidden: 1

clean_args:
  src_video+src_video_pre:
    method: send2trash
  dm_video:
    method: send2trash
